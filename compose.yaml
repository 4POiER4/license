name: license-registry
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: licenses
      POSTGRES_USER: licenses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./run-local.sh first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licenses -d licenses"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: licenses
      DB_USER: licenses
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8096}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  database:
